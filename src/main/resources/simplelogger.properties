# SLF4J SimpleLogger configuration.
#
# The interactive shell's OutputRouter captures System.out/System.err and renders them in the TUI,
# so SimpleLogger's console output shows up inside the shell. A few loggers are pure diagnostic
# chatter at INFO; quieting just those loggers removes the noise without silencing legitimate
# INFO messages elsewhere.
#
# The default level stays INFO so genuine informational output (e.g. PromptTemplateEngine's
# "Prompt template cache cleared") still appears. Application file logging is handled separately by
# CadetLogger's logToFile()/DebugLogger/SessionLogger and is unaffected by these console levels.

org.slf4j.simpleLogger.defaultLogLevel=info

# Third-party scanner: very chatty at INFO, never user-relevant.
org.slf4j.simpleLogger.log.org.reflections=error

# Diagnostic chatter on the hot path (per-request backend + one-time registry init).
org.slf4j.simpleLogger.log.com.eonmux.cadetcoder.net.OpenAICompatibleBackend=warn
org.slf4j.simpleLogger.log.com.eonmux.cadetcoder.ai.templates.ChatTemplateRegistry=warn

# ThemedOutputFormatter deliberately has no entry here: it prints the user-facing
# "[OK]/[WARN]/[ERR]/ℹ" line itself and records it with CadetLogger's *ToFile() methods, which
# write to the rotating log file without emitting an SLF4J event at all. A level override could not
# have fixed this anyway - it only silenced INFO, so the WARN/ERROR copies still reached the console
# and every error surfaced three times.

# Cleaner formatting for the warnings/errors that do surface in the shell.
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.levelInBrackets=true
